<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>SalesTrack</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f5f6fb;--card:#fff;--tx:#1e1b4b;--mu:#6b7280;--ln:#e5e7eb;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin:0 -16px 18px;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 28px;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center}
.co{font-size:20px;font-weight:800}.who{opacity:.85;font-size:13px;margin-top:2px;text-transform:capitalize}
.ghost{background:#ffffff30;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;width:auto;margin:0}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #4f46e51a}
h1{margin:0;font-size:28px}h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 5px}
input,select{width:100%;padding:13px 14px;margin-bottom:12px;border:1.5px solid var(--ln);border-radius:12px;font-size:16px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--p)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer;margin-bottom:10px}
.btn.alt{background:#eef2ff;color:var(--p)}.btn.danger{background:#fee2e2;color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-bottom:8px}
.auth{padding-top:calc(env(safe-area-inset-top,0px) + 40px);text-align:center}
.auth .card{text-align:left;margin-top:22px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
.sub{color:var(--mu);margin:6px 0 0}
.link{color:var(--mu);margin-top:16px}.link a{color:var(--p);font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #4f46e51a}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head h3{margin:0}.head button{width:auto;margin:0;padding:9px 14px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border:0}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.inf{flex:1;min-width:0}.inf b{display:block}.inf small{color:var(--mu)}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:#eef2ff;color:var(--p);font-weight:600;text-transform:capitalize}
.tag.off{background:#fee2e2;color:var(--bad)}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:99px;z-index:99;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, query, where, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== PASTE YOUR FIREBASE CONFIG HERE (same 6 values as before) ======
const firebaseConfig = {
  apiKey: "AIzaSyDFKjG4G91HOPU1f_lri3GySaEJhHcGays",
  authDomain: "salestrack-4ea83.firebaseapp.com",
  projectId: "salestrack-4ea83",
  storageBucket: "salestrack-4ea83.firebasestorage.app",
  messagingSenderId: "1086042903250",
  appId: "1:1086042903250:web:7499a5b21288064052d30b"
};
// =======================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalForceLongPolling: true });
const $ = s => document.querySelector(s);
const root = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = () => Math.random().toString(36).slice(2, 8);
const okCode = /^[a-z0-9]{3,20}$/, okUser = /^[a-z0-9_]{3,20}$/;
let me = null, company = null, busy = false, flash = "";

const render = h => { root.innerHTML = h; };
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function modal(h){ const o=document.createElement("div"); o.className="ov"; o.innerHTML=`<div class="md">${h}</div>`; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); return o; }
async function newAuthUser(email, pw){
  const sec = initializeApp(firebaseConfig, "s" + Date.now() + rnd());
  const sa = getAuth(sec);
  const cr = await createUserWithEmailAndPassword(sa, email, pw);
  await signOut(sa);
  return cr.user.uid;
}

/* ---------- LOGIN ---------- */
function loginView(){
  render(`<div class="auth"><div class="logo">📈</div><h1>SalesTrack</h1><p class="sub">Field sales tracking for your team</p>
  <div class="card">
    <label>Company code</label><input id="c" placeholder="e.g. glassco" autocapitalize="none" autocomplete="off">
    <label>Username</label><input id="u" placeholder="Username" autocapitalize="none" autocomplete="off">
    <label>Password</label><input id="p" type="password" placeholder="Password">
    <div class="err" id="e">${esc(flash)}</div>
    <button class="btn" id="go">Login</button>
  </div>
  <p class="link">New company? <a id="new">Create account</a></p></div>`);
  flash = "";
  $("#new").onclick = signupView;
  $("#go").onclick = async () => {
    const c=$("#c").value.trim().toLowerCase(), u=$("#u").value.trim().toLowerCase(), p=$("#p").value;
    if(!c||!u||!p){ $("#e").textContent="Fill all fields"; return; }
    $("#go").textContent="Logging in...";
    try{
      const l = await getDoc(doc(db,"logins",c+"__"+u));
      if(!l.exists()) throw 0;
      await signInWithEmailAndPassword(auth, l.data().email, p);
    }catch(e){ $("#e").textContent="Wrong company code, username or password"; $("#go").textContent="Login"; }
  };
}

/* ---------- COMPANY SIGNUP ---------- */
function signupView(){
  render(`<div class="auth"><div class="logo">🏢</div><h1>Create company</h1><p class="sub">You become the Boss of this company</p>
  <div class="card">
    <label>Company name</label><input id="cn" placeholder="e.g. Glass Works Pvt Ltd">
    <label>Company code (your team types this to login)</label><input id="cc" placeholder="e.g. glassco" autocapitalize="none">
    <label>Your name</label><input id="n" placeholder="Your name">
    <label>Your username</label><input id="u" placeholder="Letters, numbers, _" autocapitalize="none">
    <label>Password</label><input id="p" type="password" placeholder="Min 6 characters">
    <div class="err" id="e"></div>
    <button class="btn" id="go">Create company</button>
    <button class="btn alt" id="back">Back to login</button>
  </div></div>`);
  $("#back").onclick = loginView;
  $("#go").onclick = async () => {
    const cn=$("#cn").value.trim(), code=$("#cc").value.trim().toLowerCase(), name=$("#n").value.trim(), u=$("#u").value.trim().toLowerCase(), p=$("#p").value;
    if(!cn||!name){ $("#e").textContent="Fill all fields"; return; }
    if(!okCode.test(code)){ $("#e").textContent="Company code: 3-20 letters/numbers only"; return; }
    if(!okUser.test(u)){ $("#e").textContent="Username: 3-20 letters, numbers or _"; return; }
    if(p.length<6){ $("#e").textContent="Password min 6 characters"; return; }
    $("#go").textContent="Creating...";
    busy = true;
    try{
      if((await getDoc(doc(db,"companies",code))).exists()){ $("#e").textContent="This company code is already taken"; $("#go").textContent="Create company"; busy=false; return; }
      const email = `${code}.${u}.${rnd()}@salesapp.app`;
      const cr = await createUserWithEmailAndPassword(auth, email, p);
      const uid = cr.user.uid;
      try{
        const b = writeBatch(db);
        b.set(doc(db,"companies",code), { name:cn, code, ownerUid:uid, createdAt:serverTimestamp() });
        b.set(doc(db,"users",uid), { name, username:u, role:"boss", companyId:code, staffId:uid, active:true, createdAt:serverTimestamp() });
        b.set(doc(db,"logins",code+"__"+u), { companyId:code, email, uid });
        await b.commit();
      }catch(e2){ busy=false; await signOut(auth); flash="Could not create company. Check Firestore rules are published."; return; }
      busy = false; route(auth.currentUser);
    }catch(e){ busy=false; $("#e").textContent=e.message; $("#go").textContent="Create company"; }
  };
}

/* ---------- ROUTER ---------- */
async function route(u){
  if(!u){ loginView(); return; }
  const s = await getDoc(doc(db,"users",u.uid));
  if(!s.exists() || s.data().active === false){
    flash = s.exists() ? "Your account is disabled. Contact your boss." : "Account not found.";
    await signOut(auth); return;
  }
  me = s.data();
  company = (await getDoc(doc(db,"companies",me.companyId))).data();
  me.role === "boss" ? bossView() : staffView();
}
onAuthStateChanged(auth, u => { if(!busy) route(u); });

const header = () => `<div class="top"><div><div class="co">${esc(company.name)}</div><div class="who">${esc(me.name)} · ${esc(me.role)}</div></div><button class="ghost" id="out">Logout</button></div>`;

/* ---------- STAFF (manager / salesman) ---------- */
function staffView(){
  render(`${header()}<div class="card"><h3>Welcome, ${esc(me.name)} 👋</h3>
  <p class="sub">${me.role==="manager" ? "Your reports view is coming in the next step." : "Your targets, visit log and online toggle are coming in the next step."}</p></div>`);
  $("#out").onclick = () => signOut(auth);
}

/* ---------- BOSS ---------- */
async function bossView(){
  render(`${header()}
  <div class="stats"><div class="stat"><b id="s1">0</b><span>Salesmen</span></div><div class="stat"><b id="s2">0</b><span>Managers</span></div></div>
  <div class="card"><div class="head"><h3>Your team</h3><button class="btn" id="add">+ Add</button></div><div id="list"><div class="empty">Loading...</div></div></div>`);
  $("#out").onclick = () => signOut(auth);
  $("#add").onclick = addModal;
  loadTeam();
}

async function loadTeam(){
  const snap = await getDocs(query(collection(db,"users"), where("companyId","==",me.companyId)));
  const team = [];
  snap.forEach(d => { const x = d.data(); if(x.role !== "boss") team.push({ id:d.id, ...x }); });
  team.sort((a,b)=>a.name.localeCompare(b.name));
  $("#s1").textContent = team.filter(t=>t.role==="salesman").length;
  $("#s2").textContent = team.filter(t=>t.role==="manager").length;
  $("#list").innerHTML = team.length ? team.map(t => `
    <div class="row" data-id="${t.id}"><div class="av">${esc(t.name.trim()[0]||"?").toUpperCase()}</div>
    <div class="inf"><b>${esc(t.name)}</b><small>@${esc(t.username)}</small></div>
    ${t.active===false?'<span class="tag off">Disabled</span>':''}<span class="tag">${esc(t.role)}</span></div>`).join("")
    : '<div class="empty">No accounts yet. Tap + Add.</div>';
  document.querySelectorAll(".row").forEach(r => r.onclick = () => editModal(team.find(t=>t.id===r.dataset.id)));
}

function addModal(){
  const m = modal(`<h3>Add account</h3>
    <label>Role</label><select id="r"><option value="salesman">Salesman</option><option value="manager">Manager</option></select>
    <label>Full name</label><input id="n" placeholder="Full name">
    <label>Username (unique in your company)</label><input id="u" placeholder="Letters, numbers, _" autocapitalize="none">
    <label>Password</label><input id="p" type="text" placeholder="Min 6 characters">
    <div class="err" id="e"></div>
    <button class="btn" id="ok">Create account</button>`);
  m.querySelector("#ok").onclick = async () => {
    const n=m.querySelector("#n").value.trim(), u=m.querySelector("#u").value.trim().toLowerCase(), p=m.querySelector("#p").value, r=m.querySelector("#r").value, e=m.querySelector("#e");
    if(!n){ e.textContent="Enter name"; return; }
    if(!okUser.test(u)){ e.textContent="Username: 3-20 letters, numbers or _"; return; }
    if(p.length<6){ e.textContent="Password min 6 characters"; return; }
    m.querySelector("#ok").textContent="Creating...";
    try{
      if((await getDoc(doc(db,"logins",me.companyId+"__"+u))).exists()){ e.textContent="Username already used in your company"; m.querySelector("#ok").textContent="Create account"; return; }
      const email = `${me.companyId}.${u}.${rnd()}@salesapp.app`;
      const uid = await newAuthUser(email, p);
      const b = writeBatch(db);
      b.set(doc(db,"users",uid), { name:n, username:u, role:r, companyId:me.companyId, staffId:uid, active:true, createdAt:serverTimestamp() });
      b.set(doc(db,"logins",me.companyId+"__"+u), { companyId:me.companyId, email, uid });
      await b.commit();
      m.remove(); toast("Account created"); loadTeam();
    }catch(err){ e.textContent=err.message; m.querySelector("#ok").textContent="Create account"; }
  };
}

function editModal(x){
  const m = modal(`<h3>Edit @${esc(x.username)}</h3>
    <label>Full name</label><input id="n" value="${esc(x.name)}">
    <label>Role</label><select id="r"><option value="salesman">Salesman</option><option value="manager">Manager</option></select>
    <label>Status</label><select id="s"><option value="1">Active</option><option value="0">Disabled (cannot login)</option></select>
    <div class="err" id="e"></div>
    <button class="btn" id="save">Save changes</button>
    <label style="margin-top:8px">Reset password</label>
    <input id="np" type="text" placeholder="New password (min 6)">
    <button class="btn alt" id="rp">Set new password</button>
    <button class="btn danger" id="del">Delete account</button>`);
  m.querySelector("#r").value = x.role;
  m.querySelector("#s").value = x.active===false ? "0" : "1";
  const e = m.querySelector("#e");
  m.querySelector("#save").onclick = async () => {
    const n = m.querySelector("#n").value.trim();
    if(!n){ e.textContent="Enter name"; return; }
    try{
      await updateDoc(doc(db,"users",x.id), { name:n, role:m.querySelector("#r").value, active:m.querySelector("#s").value==="1" });
      m.remove(); toast("Saved"); loadTeam();
    }catch(err){ e.textContent=err.message; }
  };
  m.querySelector("#rp").onclick = async () => {
    const pw = m.querySelector("#np").value;
    if(pw.length<6){ e.textContent="Password min 6 characters"; return; }
    m.querySelector("#rp").textContent="Updating...";
    try{
      const email = `${x.companyId}.${x.username}.${rnd()}@salesapp.app`;
      const uid = await newAuthUser(email, pw);
      const { id, ...data } = x;
      const b = writeBatch(db);
      b.delete(doc(db,"users",id));
      b.set(doc(db,"users",uid), data);
      b.update(doc(db,"logins",x.companyId+"__"+x.username), { email, uid });
      await b.commit();
      m.remove(); toast("Password changed"); loadTeam();
    }catch(err){ e.textContent=err.message; m.querySelector("#rp").textContent="Set new password"; }
  };
  m.querySelector("#del").onclick = async () => {
    if(!confirm("Delete this account?")) return;
    try{
      const b = writeBatch(db);
      b.delete(doc(db,"users",x.id));
      b.delete(doc(db,"logins",x.companyId+"__"+x.username));
      await b.commit();
      m.remove(); toast("Deleted"); loadTeam();
    }catch(err){ e.textContent=err.message; }
  };
}
</script>
</body>
</html>
