.app [data-install]{display:none}
@media print{.nav,.ghost,.btn,.top{display:none}}
</style>

const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

  if (p === "week"){ const a = new Date(d); a.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const b = new Date(a); b.setDate(a.getDate() + 6); return [ymd(a), ymd(b)]; }

function startMgmt(){
  const c = where("companyId", "==", me.companyId), Ls = (n, fn) => unsubs.push(onSnapshot(query(collection(db, n), c), fn, e => console.log(e)));
  Ls("users", s => { D.users = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.role !== "boss"); draw(); });
  Ls("status", s => { D.status = {}; s.forEach(d => D.status[d.id] = d.data()); draw(); });
  Ls("visits", s => { D.visits = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); });
  Ls("targets", s => { D.targets = {}; s.forEach(d => D.targets[d.id] = d.data()); draw(); });
  let init = true;
  Ls("activity", s => {
    D.acts = s.docs.map(d => d.data()).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    if (!init) s.docChanges().forEach(ch => { if (ch.type === "added" && !ch.doc.metadata.hasPendingWrites && ch.doc.data().type !== "tgtset") notify(ch.doc.data().text); });
    init = false; draw();
  });
}
function startSales(){

      const em = m.querySelector("#em").value.trim().toLowerCase();
      if (em && !okMail.test(em)) { e.textContent = "Enter a valid email"; ok.textContent = "Create account"; return; }
      const email = em || `${me.companyId}.${u}.${rnd()}@salesapp.app`, uid = await newAuthUser(email, p), b = writeBatch(db);
      b.set(doc(db, "users", uid), { name: n, username: u, email: em, role: r, companyId: me.companyId, staffId: uid, active: true, createdAt: serverTimestamp() });
      b.set(doc(db, "logins", me.companyId + "__" + u), { companyId: me.companyId, email, uid });
      await b.commit(); m.remove(); toast("Account created");
    } catch(err){ e.textContent = err.code === "auth/email-already-in-use" ? "This email is already used by another account" : err.message; ok.textContent = "Create account"; }
  };
}
function editModal(x){
  if (!x) return;
  const m = modal(`<h3>${ic("edit")} Edit @${esc(x.username)}</h3>
  <p class="sub" style="margin:-6px 0 12px">${x.email ? "Recovery email: " + esc(x.email) : "No recovery email on this account"}</p>
  <label>Full name</label><input id="n" value="${esc(x.name)}">
  <label>Role</label><select id="r"><option value="salesman">Salesman</option><option value="manager">Manager</option></select>
  <label>Status</label><select id="s"><option value="1">Active</option><option value="0">Disabled (cannot sign in)</option></select>
  <div class="err" id="e"></div><button class="btn" id="save">Save changes</button>
  <label style="margin-top:8px">Reset password</label><input id="np" type="text" placeholder="New password (min 6)">
  <input id="ne" type="email" placeholder="Recovery email (optional, add or change)">
  <button class="btn alt" id="rp">Set new password</button><button class="btn danger" id="del">${ic("trash")} Delete account</button>`);
  m.querySelector("#r").value = x.role; m.querySelector("#s").value = x.active === false ? "0" : "1";
  const e = m.querySelector("#e");
  m.querySelector("#save").onclick = async () => {
    const n = m.querySelector("#n").value.trim(); if (!n) { e.textContent = "Enter name"; return; }
    try { await updateDoc(doc(db, "users", x.id), { name: n, role: m.querySelector("#r").value, active: m.querySelector("#s").value === "1" }); m.remove(); toast("Saved"); } catch(err){ e.textContent = err.message; }
  };
  m.querySelector("#rp").onclick = async () => {
    const pw = m.querySelector("#np").value; if (pw.length < 6) { e.textContent = "Password min 6 characters"; return; }
    m.querySelector("#rp").textContent = "Updating...";
    try {
      const em = m.querySelector("#ne").value.trim().toLowerCase();
      if (em && !okMail.test(em)) { e.textContent = "Enter a valid email"; m.querySelector("#rp").textContent = "Set new password"; return; }
      const email = em || `${x.companyId}.${x.username}.${rnd()}@salesapp.app`, uid = await newAuthUser(email, pw), { id, ...data } = x, b = writeBatch(db);
      b.delete(doc(db, "users", id)); b.set(doc(db, "users", uid), em ? { ...data, email: em } : data); b.update(doc(db, "logins", x.companyId + "__" + x.username), { email, uid });
      await b.commit(); m.remove(); toast("Password changed");
    } catch(err){ e.textContent = err.code === "auth/email-already-in-use" ? "This email is already used by another account" : err.message; m.querySelector("#rp").textContent = "Set new password"; }
  };
  m.querySelector("#del").onclick = async () => {
    if (!confirm("Delete this account?")) return;
    try { const b = writeBatch(db); b.delete(doc(db, "users", x.id)); b.delete(doc(db, "logins", x.companyId + "__" + x.username)); await b.commit(); m.remove(); toast("Deleted"); } catch(err){ e.textContent = err.message; }
  };
}

/* ---------- SALESMAN ---------- */
function drawSales(){
  const t = D.myTarget, p = prog(me.staffId, t), st = D.myStatus, td = ymd(new Date()), vs = [...D.visits].sort(sortV);
  const fu = vs.filter(v => v.followUp && v.followUp >= td).sort((a, b) => a.followUp.localeCompare(b.followUp)).slice(0, 5);
  render(head() + `<div class="card">${st?.online
    ? `<h3><span class="dot on" style="margin:0"></span> You are out in the field</h3><p class="sub">${esc(st.note || "")} · since ${hhmm(ms(st.since))}</p><br><button class="btn danger" id="back">I'm back (go offline)</button>`
    : `<h3><span class="dot" style="margin:0"></span> You are offline</h3><p class="sub">Tap when you leave for field work.</p><br><button class="btn green" id="go">Go out (online)</button>`}</div>
  <div class="card"><h3>${ic("target")} My target</h3>${p ? `<div class="pl"><span>${money(p.sold)} done</span><b>${p.pct}%</b></div>${bar(p.pct)}<div class="pl"><span><b>${money(p.left)}</b> left</span><small>${esc(t.start)} to ${esc(t.end)}</small></div><small>Target ${money(t.amount)}</small>` : '<p class="sub">No target set by your boss yet.</p>'}</div>
  <button class="btn" id="addv">${ic("plus")} Add visit</button>
  ${fu.length ? `<div class="card"><h3>${ic("clock")} Follow-ups</h3>${fu.map(v => `<div class="pl" style="padding:5px 0"><span>${esc(v.customer || v.place)}</span><span class="tag ${v.followUp === td ? "off" : ""}">${v.followUp === td ? "Today" : esc(v.followUp)}</span></div>`).join("")}</div>` : ""}
  <div class="card"><h3>${ic("note")} My visits</h3>${vs.slice(0, 30).map(v => vcard(v, false, true)).join("") || '<div class="empty">No visits yet.</div>'}</div>`);
  $("#out").onclick = () => signOut(auth);
  $("#addv").onclick = () => visitModal();
  $$("[data-ev]").forEach(b => b.onclick = () => visitModal(D.visits.find(v => v.id === b.dataset.ev)));
  if ($("#go")) $("#go").onclick = goOut;
  if ($("#back")) $("#back").onclick = () => {
    setDoc(doc(db, "status", me.staffId), { companyId: me.companyId, staffId: me.staffId, name: me.name, online: false, note: "", since: serverTimestamp() }).catch(e => toast(e.message));
    act("in", `${me.name} is back from the field`);
  };
}
function goOut(){
  const m = modal(`<h3>${ic("pin")} Where are you going?</h3><input id="n" placeholder="e.g. Agra – shops visit"><button class="btn green" id="ok">Go online</button>`);
  m.querySelector("#ok").onclick = () => {
    const note = m.querySelector("#n").value.trim() || "Field visit";
    setDoc(doc(db, "status", me.staffId), { companyId: me.companyId, staffId: me.staffId, name: me.name, online: true, note, since: serverTimestamp() }).catch(e => toast(e.message));
    act("out", `${me.name} went out: ${note}`); m.remove();
  };
}
const FN = { place: "place", date: "date", time: "time", customer: "customer", product: "product", amount: "amount", expense: "expense", rating: "rating", meeting: "meeting notes", experience: "customer experience", followUp: "follow-up" };
function diff(o, n){
  const f = (k, x) => k === "amount" || k === "expense" ? money(x) : (String(x || "—").slice(0, 40));
  return Object.keys(FN).filter(k => String(o[k] ?? "") !== String(n[k] ?? "")).map(k => `${FN[k]}: ${f(k, o[k])} → ${f(k, n[k])}`);
}
function visitModal(ev){
  const e = ev || {}, now = new Date(), custs = [...new Set(D.visits.map(v => v.customer).filter(Boolean))];
  const m = modal(`<h3>${ic(ev ? "edit" : "plus")} ${ev ? "Edit visit" : "Add visit"}</h3>
  <label>Place *</label><input id="pl" placeholder="e.g. Agra, Sadar Bazaar" value="${esc(e.place || "")}">
  <div style="display:flex;gap:10px"><div style="flex:1"><label>Date</label><input id="d" type="date" value="${e.date || ymd(now)}"></div><div style="flex:1"><label>Time</label><input id="t" type="time" value="${e.time || now.toTimeString().slice(0, 5)}"></div></div>
  <label>Customer name</label><input id="c" list="cl" placeholder="Customer / shop name" value="${esc(e.customer || "")}"><datalist id="cl">${custs.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
  <label>What happened in the meeting</label><textarea id="mt">${esc(e.meeting || "")}</textarea>
  <label>Customer experience / review</label><textarea id="ex">${esc(e.experience || "")}</textarea>
  <label>Customer rating</label><select id="rt"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Very poor</option><option value="0">No rating</option></select>
  <label>Product sold</label><input id="pd" placeholder="e.g. Wall mirror 4x3" value="${esc(e.product || "")}">
  <label>Order amount (₹)</label><input id="am" type="number" inputmode="numeric" placeholder="0" value="${e.amount || ""}">
  <label>Travel expense (₹)</label><input id="xp" type="number" inputmode="numeric" placeholder="0" value="${e.expense || ""}">
  <label>Follow-up date</label><input id="fu" type="date" value="${e.followUp || ""}">
  <label>Photo (shop / order proof)${ev && e.photo ? " – pick a new one to replace" : ""}</label><input id="ph" type="file" accept="image/*">
  <div class="err" id="er"></div><button class="btn" id="ok">${ev ? "Save changes" : "Save visit"}</button>
  ${ev ? `<button class="btn danger" id="del">${ic("trash")} Delete visit</button><p class="sub">Your boss is notified of every edit and delete.</p>` : ""}`);
  const q = s => m.querySelector(s);
  q("#rt").value = String(e.rating ?? 5);
  q("#ok").onclick = async () => {
    const place = q("#pl").value.trim(); if (!place) { q("#er").textContent = "Enter place"; return; }
    q("#ok").textContent = "Saving...";
    const n = { place, date: q("#d").value, time: q("#t").value, customer: q("#c").value.trim(), meeting: q("#mt").value.trim(), experience: q("#ex").value.trim(), rating: +q("#rt").value, product: q("#pd").value.trim(), amount: +q("#am").value || 0, expense: +q("#xp").value || 0, followUp: q("#fu").value };
    const file = q("#ph").files[0], photo = file ? await shrink(file) : null;
    if (ev) {
      const ch = diff(ev, n); if (file) ch.push("photo changed");
      if (!ch.length) { m.remove(); return; }
      updateDoc(doc(db, "visits", ev.id), { ...n, ...(file ? { photo } : {}), editedAt: serverTimestamp() }).catch(er => toast(er.message));
      act("edit", `${me.name} edited a visit (${ev.place}, ${ev.date}): ${ch.join("; ")}`);
      m.remove(); toast("Changes saved, boss notified"); return;
    }
    const t = D.myTarget, before = prog(me.staffId, t)?.sold || 0;
    addDoc(collection(db, "visits"), { companyId: me.companyId, staffId: me.staffId, staffName: me.name, ...n, photo: photo || "", createdAt: serverTimestamp() }).catch(er => toast(er.message));
    act("visit", `${me.name} visited ${place}${n.amount ? " · " + money(n.amount) : ""}`);
    if (t && n.amount && n.date >= t.start && n.date <= t.end) [50, 80, 100].forEach(x => { if (before < t.amount * x / 100 && before + n.amount >= t.amount * x / 100) act("target", `${me.name} reached ${x}% of target`); });
    m.remove(); toast("Visit saved");
  };
  if (ev) q("#del").onclick = () => {
    if (!confirm("Delete this visit?")) return;
    deleteDoc(doc(db, "visits", ev.id)).catch(er => toast(er.message));
    act("del", `${me.name} deleted a visit: ${ev.place}, ${ev.date}${+ev.amount ? " · " + money(ev.amount) : ""}`);
    m.remove(); toast("Visit deleted, boss notified");
  };
}
